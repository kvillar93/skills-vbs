services:
  app:
    image: mauriceboe/trek:latest
    container_name: trek
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VIRTUAL_HOST=trek.vbsolutions.app
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=trek.vbsolutions.app
      - LETSENCRYPT_EMAIL=kevin@vbsolutions.info
      - HTTPS_METHOD=redirect
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  proxy:
    name: proxy
    external: true
